<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radar de Pipo — Sin Filtro y Sin Algoritmo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>RADAR DE PIPO</h1>
      <p id="last-updated" class="subtitle">Pipo está revisando la pizarra...</p>
      <div class="action-bar" style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px;">
        <button id="refresh-btn" type="button" class="mode-btn">Actualizar noticias</button>
        <button id="token-btn" type="button" class="mode-btn" title="Opcional: configura un token de GitHub para disparar el robot desde aquí">
          ⚙️ Configurar botón
        </button>
        <a
          href="https://github.com/cokereyaicardi/Pipo/actions/workflows/actualizar.yml"
          target="_blank"
          rel="noopener noreferrer"
          class="mode-btn"
          style="text-decoration: none; display: inline-flex; align-items: center;"
        >
          Correr robot ↗
        </a>
      </div>
      <p id="status-msg" class="subtitle" style="margin-top: 6px; font-size: 0.85rem;"></p>
    </div>
    <div class="mode-switch">
      <button class="mode-btn active" data-mode="all">Ambos tonos</button>
      <button class="mode-btn" data-mode="formal">Solo Análisis</button>
      <button class="mode-btn" data-mode="tribuna">La Tribuna de Pipo</button>
    </div>
  </header>

  <nav class="tabs" id="category-tabs">
    <button class="tab active" data-cat="all">Todo</button>
    <button class="tab" data-cat="economia">Economía & Mercados</button>
    <button class="tab" data-cat="chile">Fútbol Chileno</button>
    <button class="tab" data-cat="argentina">Fútbol Argentino</button>
    <button class="tab" data-cat="italia">Fútbol Italiano</button>
    <button class="tab" data-cat="brasil">Fútbol Brasileño</button>
  </nav>

  <main id="feed-container" class="grid"></main>

  <script src="app.js"></script>
</body>
</html>
