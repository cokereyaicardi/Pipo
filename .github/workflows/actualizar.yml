name: Actualizar Radar de Pipo

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-briefing:
    runs-on: ubuntu-latest
    name: Actualizar Radar de Pipo

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: pipo-briefing
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar Pipo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate.py

      - name: Guardar nuevo briefing.json
        run: |
          git config user.name "Pipo Bot"
          git config user.email "pipo-bot@users.noreply.github.com"
          git add data/briefing.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática de Pipo" && git push)
